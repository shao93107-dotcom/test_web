<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什麼？抽籤器</title>
  <style>
    /* ===== 可調整的主要樣式 ===== */
    :root {
      --main-color: #e87945;
      --main-hover: #cf6332;
      --background: #fff8f1;
      --card-background: #ffffff;
      --text-color: #342a25;
      --muted-color: #776b64;
      --border-color: #eaded4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--background);
      color: var(--text-color);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 620px;
      padding: 30px;
      background: var(--card-background);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      box-shadow: 0 12px 36px rgba(86, 55, 35, 0.09);
    }

    .header { text-align: center; margin-bottom: 26px; }
    .emoji { font-size: 42px; margin-bottom: 8px; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 34px); }
    .subtitle { margin: 0; color: var(--muted-color); line-height: 1.7; }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 170px;
      resize: vertical;
      padding: 14px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font: inherit;
      line-height: 1.8;
      color: var(--text-color);
      background: #fffdfb;
      outline: none;
    }

    textarea:focus {
      border-color: var(--main-color);
      box-shadow: 0 0 0 3px rgba(232, 121, 69, 0.15);
    }

    .hint {
      margin: 8px 0 18px;
      color: var(--muted-color);
      font-size: 13px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--main-color);
      color: white;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover { background: var(--main-hover); }
    button:active { transform: scale(0.99); }
    button:focus-visible { outline: 3px solid #f4b18f; outline-offset: 3px; }

    .result {
      margin-top: 22px;
      padding: 22px 16px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      background: #fffcf8;
    }

    .result-label {
      margin-bottom: 10px;
      color: var(--muted-color);
      font-size: 14px;
    }

    #resultText {
      margin: 0;
      color: var(--main-color);
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    #resultText.error {
      color: #b42318;
      font-size: 17px;
      font-weight: 700;
    }

    #optionCount {
      margin-top: 10px;
      color: var(--muted-color);
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body { padding: 16px 10px; }
      .app { padding: 22px 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="emoji" aria-hidden="true">🍱</div>
      <h1>今天吃什麼？</h1>
      <p class="subtitle">選擇困難交給我，今天的午餐就這樣決定！</p>
    </header>

    <section>
      <label for="optionsInput">你的候選清單（每行一個選項）</label>
      <textarea id="optionsInput" spellcheck="false">便當
麵
咖哩
水餃</textarea>
      <p class="hint">小提醒：空白行會自動忽略，相同的選項只會保留一次。</p>
      <button id="drawButton" type="button">🎲 幫我選</button>
    </section>

    <section class="result" aria-live="polite" aria-atomic="true">
      <div class="result-label">✨ 今日幸運美食 ✨</div>
      <p id="resultText">準備好抽籤了！</p>
      <div id="optionCount">目前有 4 個有效選項</div>
    </section>
  </main>

  <script>
    // ===== 主要功能 =====
    const optionsInput = document.getElementById("optionsInput");
    const drawButton = document.getElementById("drawButton");
    const resultText = document.getElementById("resultText");
    const optionCount = document.getElementById("optionCount");

    // 清理清單：去除每行前後空白、空白行與完全相同的重複選項
    function getValidOptions() {
      const lines = optionsInput.value.split(/\r?\n/);
      const cleaned = lines
        .map(line => line.trim())
        .filter(line => line.length > 0);

      // Set 會保留首次出現的選項，並移除完全相同的重複項目
      return [...new Set(cleaned)];
    }

    // 抽籤：每個有效選項的機率相同
    function drawOption() {
      const options = getValidOptions();
      resultText.classList.remove("error");

      if (options.length === 0) {
        resultText.textContent = "請先輸入至少一個選項";
        resultText.classList.add("error");
        optionCount.textContent = "目前有 0 個有效選項";
        return;
      }

      // 隨機產生有效索引，範圍是 0 到 options.length - 1
      const randomIndex = Math.floor(Math.random() * options.length);
      resultText.textContent = options[randomIndex];
      optionCount.textContent = `從 ${options.length} 個有效選項中抽出`;
    }

    // 按下按鈕時執行抽籤
    drawButton.addEventListener("click", drawOption);

    // 編輯清單時同步更新有效選項數量
    optionsInput.addEventListener("input", () => {
      const count = getValidOptions().length;
      optionCount.textContent = `目前有 ${count} 個有效選項`;
    });
  </script>
</body>
</html>
